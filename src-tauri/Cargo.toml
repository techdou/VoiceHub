[package]
name = "soundbridge-app"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true

[lib]
name = "soundbridge_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
base64 = "0.22"
transcribe-cpp = { version = "=0.1.3", default-features = false, features = ["dynamic-backends"] }
sb-core = { path = "../crates/sb-core" }
sb-windows = { path = "../crates/sb-windows" }
voicehub-sayit = { path = "../vendor/sayit/native" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tokio.workspace = true
chrono.workspace = true
log = "0.4"
sys-locale = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
runtime-simulation = []
vulkan = ["voicehub-sayit/vulkan"]
