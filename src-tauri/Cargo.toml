[package]
name = "soundbridge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "soundbridge_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
sb-core = { path = "../crates/sb-core" }
sb-windows = { path = "../crates/sb-windows" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
tauri-plugin-autostart = "2.5"
tokio.workspace = true
chrono.workspace = true
log = "0.4"
sys-locale = "0.3"

[features]
runtime-simulation = []
